name: النشر على GitHub Pages (فرع gh-pages)

# يبني البرنامج ويدفع الناتج إلى فرع gh-pages.
# في الإعدادات: Settings ← Pages ← Deploy from a branch ← gh-pages / (root)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: البناء
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: الدفع إلى gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "نشر ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
